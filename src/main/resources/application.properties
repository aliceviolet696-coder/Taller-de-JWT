spring.application.name=patitas-al-rescate-jwt
server.port=8080
server.error.include-message=never

# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/refugio_patitas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# "update" crea/actualiza la tabla usuarios automáticamente.
# También puede ejecutarse database/init.sql y usar "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# JWT (Hito 3 y 4)
# ---------------------------------------------------------------------------
# En producción defina JWT_SECRET como variable de entorno. El secreto debe
# tener al menos 32 bytes (256 bits) para HS256.
jwt.secret=${JWT_SECRET:PatitasAlRescate-2026-Firma-Digital-SoloLaboratorio-32bytes}
jwt.issuer=patitas-al-rescate
jwt.expiration-seconds=1800
