# Configuración exclusiva de pruebas: H2 en memoria con dialecto PostgreSQL.
spring.datasource.url=jdbc:h2:mem:patitas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=PatitasAlRescate-Test-Secret-Con-Mas-De-32-Bytes-Para-HS256
jwt.issuer=patitas-al-rescate
jwt.expiration-seconds=1800
